[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-reader"
version = "0.1.0"
description = "阅读文本自适应重写工具：摄取 / 概念清单 / 画像 / 本地 HTTP 服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "PyYAML>=6.0",
]

[project.scripts]
ar = "ar.cli:entry"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "playwright==1.39.0",
    "pytest-playwright>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 系统 Python 里另装了第三方 pytest-benchmark：不关掉它，系统 Python 跑 `pytest tests/web`
# 就会在项目根生成一个空 `.benchmarks/`（本项目不做基准测试，那是环境噪声）。
# 本项目依赖里没有它，uv 环境装了也无害：`-p no:名字` 对不存在的插件不报错。
addopts = "-p no:benchmark"
# tests/web 归前端（W2）：默认 `pytest tests` 不收集它，前端无头用例单独跑 `pytest tests/web`
norecursedirs = ["web"]
# 本机 %TEMP% 不可写，pytest 的 basetemp 会落到项目根（pytest-of-*/）：跑完即清，别留垃圾
tmp_path_retention_policy = "none"
